<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1f1d1a;--muted:#6b665d;--line:#e3ddd1;--accent:#3f8f3a;--off:#b5452f;--chip:#efe9dc}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1c19;--ink:#ece8df;--muted:#9a948a;--line:#2e2c27;--accent:#6cc463;--off:#e07a63;--chip:#262420}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px 56px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 28px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.status{display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.on .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.off .dot{background:var(--off)}
.meta{color:var(--muted);font-weight:400;font-size:14px;margin-left:auto}
.addr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.addr code{font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--chip);padding:8px 12px;border-radius:8px}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
.label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.players{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.players li{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:8px;padding:6px 10px 6px 6px}
.players img{width:24px;height:24px;border-radius:4px;image-rendering:pixelated}
.empty{color:var(--muted);margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dt{color:var(--muted)}dd{margin:0}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1 id="title">__TITLE__</h1>
  <p class="sub" id="subtitle">__SUBTITLE__</p>

  <section class="card status" id="status"><span class="dot"></span><span id="state">Проверяю…</span><span class="meta" id="latency"></span></section>

  <section class="card">
    <p class="label">Адрес сервера</p>
    <div class="addr"><code id="address">__ADDRESS__</code><button id="copy" type="button">Скопировать</button></div>
  </section>

  <section class="card">
    <p class="label" id="players-label">Игроки</p>
    <ul class="players" id="players"></ul>
    <p class="empty" id="empty" hidden>Сейчас никого нет</p>
  </section>

  <section class="card">
    <p class="label">Сборка</p>
    <dl>
      <dt>Модпак</dt><dd id="pack">—</dd>
      <dt>Версия</dt><dd id="version">—</dd>
      <dt>Модов</dt><dd id="mods">—</dd>
    </dl>
  </section>

  <footer id="checked">Обновляется каждые 15 секунд</footer>
</main>
<script>
const $ = id => document.getElementById(id);
async function refresh() {
  let s;
  try { s = await (await fetch("/api/status", {cache: "no-store"})).json(); }
  catch { s = {online: false}; }
  const box = $("status");
  box.classList.toggle("on", !!s.online);
  box.classList.toggle("off", !s.online);
  $("state").textContent = s.online ? "Сервер онлайн" : "Сервер оффлайн";
  $("latency").textContent = s.online ? `${s.players} / ${s.max}` : "";
  if (s.title) { $("title").textContent = s.title; document.title = s.title; }
  if (s.subtitle) $("subtitle").textContent = s.subtitle;
  if (s.address) $("address").textContent = s.address;
  if (s.pack) $("pack").textContent = s.pack;
  $("version").textContent = s.version ? `${s.loader || ""} ${s.version}`.trim() : "—";
  $("mods").textContent = s.mods ? `около ${s.mods}` : "—";
  const list = $("players");
  list.replaceChildren();
  for (const name of s.names || []) {
    const li = document.createElement("li");
    const img = document.createElement("img");
    img.alt = ""; img.loading = "lazy";
    img.src = "https://mc-heads.net/avatar/" + encodeURIComponent(name) + "/24";
    const span = document.createElement("span");
    span.textContent = name;
    li.append(img, span);
    list.append(li);
  }
  $("players-label").textContent = s.online ? `Игроки — ${s.players}` : "Игроки";
  $("empty").hidden = !(s.online && !s.players);
  $("checked").textContent = "Обновлено " + new Date().toLocaleTimeString("ru-RU") + " · каждые 15 секунд";
}
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("address").textContent); $("copy").textContent = "Скопировано"; }
  catch { $("copy").textContent = "Выдели и скопируй"; }
  setTimeout(() => $("copy").textContent = "Скопировать", 2000);
});
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
