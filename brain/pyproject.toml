[project]
name = "modpack-brain"
version = "0.1.0"
description = "ИИ-помощник по сборке Prominence II и мост Telegram ↔ Minecraft"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "claude-agent-sdk>=0.2.163",
    "pydantic-settings>=2.15.0",
    "websockets>=17.2",
]

[project.scripts]
modpack-brain = "modpack_brain.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
